[project]
name = "morrow-crawler"
version = "0.1.0"
description = "Schema-first product sourcing crawler"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "selectolax>=0.3.28,<1",
]

[project.scripts]
crawler = "crawler.cli:main"

[dependency-groups]
dev = [
  "jsonschema>=4.25,<5",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crawler"]

[tool.pytest.ini_options]
addopts = "-m 'not live'"
asyncio_mode = "auto"
markers = ["live: tests that access a real supplier site"]
testpaths = ["tests"]
